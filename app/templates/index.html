<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PicCrawler 图片在线浏览下载系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="noise"></div>
    <header class="topbar">
      <div>
        <p class="kicker">PicCrawler</p>
        <h1>图片在线浏览下载系统</h1>
      </div>
      <button id="btn-mobile-tools" class="mobile-tools-toggle" type="button" aria-expanded="false">
        工具
      </button>
      <div class="shelf-form">
        <input id="shelf-name" type="text" placeholder="新增本地书架名称" />
        <div class="shelf-roots-row">
          <input id="shelf-roots-display" type="text" placeholder="请选择本地书架目录" readonly />
          <button id="btn-pick-shelf-root" type="button">选择目录</button>
          <button id="btn-clear-shelf-roots" type="button">清空</button>
        </div>
        <button id="btn-create-shelf" type="button">新增书架</button>
      </div>
    </header>

    <main class="layout">
      <section class="main-panel">
        <div id="tabs" class="tabs"></div>

        <div id="tab-actions" class="tab-actions"></div>

        <div id="topic-grid" class="topic-grid"></div>

        <div class="pager">
          <button id="btn-prev">上一页</button>
          <span id="page-info">第 1 页</span>
          <div class="pager-jump">
            <input id="page-jump-input" type="number" min="1" step="1" placeholder="页码" />
            <button id="btn-page-jump" type="button">跳转</button>
          </div>
          <button id="btn-next">下一页</button>
        </div>
      </section>

      <aside class="side-panel hidden">
        <h2>下载队列</h2>
        <div id="job-list" class="job-list"></div>
      </aside>
    </main>

    <section id="viewer" class="viewer hidden">
      <div class="viewer-mask" id="viewer-close-mask"></div>
      <div class="viewer-card">
        <div class="viewer-head">
          <h3 id="viewer-title">主题预览</h3>
          <button id="viewer-close">关闭</button>
        </div>
        <div id="viewer-body" class="viewer-body"></div>
      </div>
    </section>

    <section id="folder-picker" class="folder-picker hidden">
      <div class="folder-picker-mask" id="folder-picker-mask"></div>
      <div class="folder-picker-card">
        <div class="folder-picker-head">
          <h3>选择目录</h3>
          <button id="folder-picker-close" type="button">关闭</button>
        </div>
        <div class="folder-picker-path" id="folder-picker-path">请选择磁盘</div>
        <div class="folder-picker-toolbar">
          <button id="folder-picker-up" type="button">上一级</button>
          <button id="folder-picker-refresh" type="button">刷新</button>
          <button id="folder-picker-choose" type="button">选择当前目录</button>
        </div>
        <div class="folder-picker-list" id="folder-picker-list"></div>
        <div class="folder-picker-foot">
          <button id="folder-picker-cancel" type="button">取消</button>
        </div>
      </div>
    </section>

    <button id="btn-download-fab" class="download-fab is-hidden" type="button">下载选中</button>
    <div id="toast" class="toast hidden"></div>

    <script src="/static/app.js"></script>
  </body>
</html>
